apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.conductor'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Whether to compile the optional Firebase Cloud Messaging trigger. Toggled by the
// config plugin via gradle property `expo.conductor.enableFcm`.
def enableFcm = (findProperty('expo.conductor.enableFcm') ?: 'false').toString().toBoolean()

android {
  namespace "expo.modules.conductor"
  defaultConfig {
    minSdkVersion 24
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
  sourceSets {
    main {
      if (!enableFcm) {
        java.srcDirs += []
        java.exclude '**/ConductorMessagingService.kt'
      }
    }
  }
}

dependencies {
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  implementation "androidx.core:core-ktx:1.13.1"
  if (enableFcm) {
    implementation "com.google.firebase:firebase-messaging:24.0.0"
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
