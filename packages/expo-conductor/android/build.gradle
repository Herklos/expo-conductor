apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.conductor'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Whether to bundle the optional Firebase Cloud Messaging trigger at runtime and register
// its manifest <service>. Toggled by the config plugin via gradle property
// `expo.conductor.enableFcm`. Note: ConductorMessagingService.kt always compiles (see
// compileOnly dependency below) — java.exclude does NOT filter the Kotlin compile task
// (AGP+KGP gotcha), so enableFcm only controls runtime bundling + manifest registration.
def enableFcm = (findProperty('expo.conductor.enableFcm') ?: 'false').toString().toBoolean()

android {
  namespace "expo.modules.conductor"
  defaultConfig {
    minSdkVersion 24
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  implementation "androidx.core:core-ktx:1.13.1"
  // compileOnly so ConductorMessagingService.kt always compiles — `java.exclude` in the
  // sourceSets block does NOT filter the Kotlin compile task (AGP+KGP gotcha), so the
  // file is fed to kotlinc even when FCM is disabled. With enableFcm=false the config
  // plugin never adds the manifest <service>, so the inert class is never loaded. When
  // enabled, the `implementation` line below bundles firebase-messaging at runtime too.
  compileOnly "com.google.firebase:firebase-messaging:24.0.0"
  if (enableFcm) {
    implementation "com.google.firebase:firebase-messaging:24.0.0"
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
